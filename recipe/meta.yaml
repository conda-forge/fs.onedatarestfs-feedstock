{% set name = "fs.onedatarestfs" %}
{% set version = "25.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/fs_onedatarestfs-{{ version }}.tar.gz
  sha256: 9e192824541f7d9ab948e70e61aa5c91560e788f732519a5e4122bbfeb3c62d4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - fs
    - onedatafilerestclient

test:
  imports:
    - fs.onedatarestfs
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/onedata/onedatarestfs
  summary: Onedata REST-based filesystem for PyFilesystem
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - bgruening
