{% set name = "fs.onedatarestfs" %}
{% set version = "25.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/fs_onedatarestfs-{{ version }}.tar.gz
  sha256: 9a23b8060435adf8beb37e0255db7e19398780becd4930095455e5dea0ecfce3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - fs
    - onedatafilerestclient

test:
  imports:
    - fs.onedatarestfs
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/onedata/onedatarestfs
  summary: Onedata REST-based filesystem for PyFilesystem
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - bgruening
